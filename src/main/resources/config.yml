# General Notes:
# - ProtocolLib is required for chain visualization.
# - Make sure the values are within appropriate ranges to prevent performance issues.

##########################
#     Chain Settings     #
##########################

# chain-max-players: Defines the maximum number of players allowed in a single chain.
# Default: 100
chain-max-players: 100

# chain-length: Specifies the length of the chain (in blocks) between adjacent players in the chain.
# Default: 6
chain-length: 6

# chain-stretch: Defines the maximum stretch of the chain beyond the defined chain-length (in blocks).
# Allows the chain to stretch this amount, but it's not factored in the pulling force, making a short chain with high stretch snappier.
# Default: 0.25
chain-stretch: 0.25

# chain-elasticity: Controls the elasticity of the chain. A higher value causes players to be pulled back to each other more quickly when they exceed the chain length.
# This value is very delicate, so experiment with low values close to default.
# - Higher values = faster pull-back
# - Lower values = slower, more gradual pull-back
# Default: 0.0475
chain-elasticity: 0.0475

# chain-visualization: The visual representation of the chain.
# Values:
# - LEAD: Uses invisible entities and ProtocolLib to render Minecraft leads between players (requires ProtocolLib)
# - PARTICLE: Renders a colored particle line between players (no dependencies)
# - DISABLED: No visualization
# Default: LEAD
chain-visualization: LEAD

##########################
#   Particle Settings    #
##########################
# Only used when chain-visualization is set to PARTICLE

# max-particles: Maximum number of particles rendered between two adjacent players
# Default: 50
max-particles: 50

# particle-size: Size of each particle
# Default: 1.0
particle-size: 1.0

# start_color / end_color: Gradient colors (RGB) from one player to the next
start_color:
  red: 128
  green: 128
  blue: 128

end_color:
  red: 0
  green: 0
  blue: 0

##########################
#   Teleport Settings    #
##########################

# chain-pearl-behavior: How the chain handles ender pearl teleports
# Values:
# - TELEPORT_ALL: All chained players teleport to the pearl destination
# - NORMAL: Only the pearl thrower teleports, chain pull handles the rest
# Default: TELEPORT_ALL
chain-pearl-behavior: TELEPORT_ALL

##############
# Debug Mode #
##############
# debug: Some debugging in console for development
# Default: false
debug: false
